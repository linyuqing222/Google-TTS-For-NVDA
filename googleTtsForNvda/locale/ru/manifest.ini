summary = "GoogleTTSForNVDA (Google TTS для NVDA)"
description = """Дополнение Google TTS For NVDA позволяет использовать голоса синтезатора речи Google в программе экранного доступа NVDA для Windows.
Оно использует технологию WebAssembly (WASM), работающую в фоновой среде выполнения браузера на основе Chromium.
Дополнение поддерживает браузеры Google Chrome, Microsoft Edge и Brave в качестве фоновой среды выполнения.
После загрузки нужных голосовых пакетов дополнение работает полностью автономно.
Оно обеспечивает быстрый отклик речи без необходимости постоянного подключения к интернету.
Дополнение предоставляет множество голосовых пакетов Google TTS для различных языков.
Встроенный Менеджер голосов Google TTS позволяет удобно просматривать и управлять голосовыми пакетами.
Менеджер содержит две вкладки для управления установленными пакетами и загрузки новых.
Поддерживается фильтрация голосовых пакетов по языку для быстрого поиска.
Дополнение позволяет выбрать предпочитаемый браузер на Chromium для фоновой работы.
Доступна функция автоматических языковых профилей для разных языков.
Каждый языковой профиль может иметь собственный голос и параметры речи.
Автоматические языковые профили используют встроенный детектор языка CLD2.
Результаты определения языка принимаются только при достаточной надёжности.
Для работы требуется установленный браузер на Chromium, а также Microsoft Edge WebView2 Runtime при использовании Edge.
Google TTS For NVDA — это независимый проект с открытым исходным кодом в области доступности. Он не связан с Google LLC, не спонсируется и не одобряется ею. Google является товарным знаком Google LLC.
Все функции дополнения описаны в справочном руководстве."""
changelog = """Версия 1.0:
- Улучшена отзывчивость чтения для средних и длинных текстов: обеспечен более быстрый старт, плавная буферизация аудио и повторное использование завершённого аудио, временно хранящегося в ОЗУ.
- Улучшено разбиение на предложения и фразы для многоязычных текстов, а также функция «Использовать автоматические языковые профили» на основе официальных данных Unicode 17.0 и CLDR 48.2.
- Повышена стандартная громкость речи, обеспечена более стабильная громкость без аномальных скачков. Настройка громкости остаётся пропорциональной. Искажения в некоторых мужских голосах возникают из-за особенностей оригинального движка WASM TTS и не устранены данным изменением.
- Улучшено восстановление после сбоев в среде выполнения Chromium, движке WASM TTS и аудиовыходе NVDA; предотвращено сохранение неработоспособных сред выполнения при включённой опции «Держать среду выполнения Google TTS готовой в фоновом режиме»; уменьшены конфликты с другими дополнениями.
- Обновлён встроенный движок WASM TTS до версии 20260806.1.
- Добавлены переводы на испанский и бразильский португальский языки, а также переписана упрощённая китайская локализация с использованием официальной терминологии NVDA."""
