summary = "Google TTS Para NVDA"
description = """Permite utilizar localmente las voces de texto a voz de Google basadas en WASM mediante el entorno de ejecución de un navegador Chromium compatible, como Google Chrome, Microsoft Edge o Brave, y emplearlas como sintetizador de NVDA. Google TTS Para NVDA es un proyecto de accesibilidad independiente y de código abierto. No está afiliado a Google LLC ni cuenta con su patrocinio o respaldo. Google es una marca comercial de Google LLC."""
changelog = """Versión 1.0:
- Se mejoró la respuesta al leer textos medianos y largos, con un inicio más rápido, un almacenamiento en búfer de audio más fluido y la reutilización del audio terminado que se conserva temporalmente en la RAM.
- Se mejoraron las divisiones de frases y expresiones multilingües y la función Utilizar perfiles de idioma automáticos mediante datos oficiales de Unicode 17.0 y CLDR 48.2.
- Se aumentó el volumen predeterminado de la voz y se mantuvo más estable, sin subidas ni bajadas anormales. La opción Volumen sigue siendo proporcional. La distorsión de algunas voces masculinas procede del motor WASM TTS original y este cambio no la corrige.
- Se mejoró la recuperación tras fallos del entorno de ejecución del navegador Chromium, del motor WASM TTS y de la salida de audio de NVDA; se impidió que Mantener preparado en segundo plano el entorno de ejecución del navegador de Google TTS conservara entornos en mal estado; y se redujeron los conflictos con otros complementos.
- Se actualizó el motor WASM TTS incluido a la versión 20260806.1.
- Se añadieron las traducciones al español y al portugués de Brasil, y se reescribió la traducción al chino simplificado con la terminología oficial de NVDA."""
